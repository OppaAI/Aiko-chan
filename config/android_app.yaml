# Android app + game config
#
# Settings for the Android companions (Aiko-Lingo / Aiko-Shogi) and the
# server-side game + lingo-spawn tunables they depend on.
# Loaded via config/index.yaml -> system/config.py -> os.environ.
# Real process env vars still win over these values.
#
# YaneuraOu engine is optional: when YANEURAOU_PATH points at an executable
# binary, /api/games/shogi uses it for strong moves; otherwise Aiko falls
# back to casual random moves (python-shogi).

# -- YaneuraOu (Shogi engine, USI) --
YANEURAOU_PATH: "/home/oppa-ai/YaneuraOu/source/YaneuraOu-by-gcc"  # Jetson Orin Nano layout (~/YaneuraOu); blank = search PATH, fallback to random moves.
YANEURAOU_MOVETIME_MS: "800"  # Engine search time per move (ms); clamped 50-30000. Used by hard; easy/medium use their own caps below.
SHOGI_DIFFICULTY: "medium"  # easy | medium | hard. easy = depth 3 + 150ms + 35% random moves; medium = depth 6 + 400ms + 10% random; hard = full strength, no random.
SHOGI_BANTER: "1"  # Aiko says one short LLM line on notable moves (1/true/yes/on). Adds seconds per gated move on Nano; 0 = silent template comments only.
SHOGI_BANTER_FREQUENCY: "0.25"  # Odds of a line on a quiet move (0 = notable moments only, 1 = every move).
SHOGI_MAIN_TIME_S: "3600"  # Main time per side in seconds (60 min). 0 = sudden-death byoyomi (every move within SHOGI_BYOYOMI_S).
SHOGI_BYOYOMI_S: "60"  # Byoyomi allowance per move in seconds once main time is gone. 0 with 0 main = no clock.

# -- Aiko self-play vs YaneuraOu (interface/android_app/shogi/selfplay.py) --
# Aiko moves by opening book -> Jev choice -> random fallback; learns via
# book w/d/l, namespaced match store, experience rows, and FlyMB teaching.
SELFPLAY_MOVETIME_MS: "800"  # Engine think time per Aiko-vs-engine game move (ms).
SELFPLAY_ENGINE_DEPTH: "5"  # Training handicap: USI `go depth` cap (e.g. 6-10) so games are winnable; blank = full strength.
SELFPLAY_MAX_MOVES: "256"  # Plies before adjudicated draw.
SELFPLAY_BOOK_MIN_VISITS: "3"  # Book needs this many visits to play a line.
SELFPLAY_JEV_CANDIDATES: "10"  # Max moves offered to Jev per Aiko turn.
SELFPLAY_EXPLORATION: "0.05"  # Epsilon for book exploration.
SELFPLAY_JEV_RETRIES: "3"  # Jev attempts per Aiko decision (plus client-level backoff). Exhaustion voids the game — random moves are never recorded or learned.
SELFPLAY_GO_SIZE: "13"  # Board size for Go self-play (9 | 13 | 19). 9x9 trains fastest.
SELFPLAY_GO_KOMI: "6.5"  # Komi for Tromp-Taylor area scoring (all stones alive).
SELFPLAY_GO_MAX_MOVES: "0"  # Ply cap (0 = size*size*3).
SELFPLAY_KOI_MONTHS: "6"  # Months per Koi-Koi self-play match (1-12).
SELFPLAY_KOI_BLUNDER: "easy"  # Heuristic sparring level (beatable curriculum).

# -- KataGo (Go engine, GTP) --
# Built for Jetson Orin Nano (aarch64, TensorRT backend). b10c128 is the
# Nano-friendly network. Blank PATH = search PATH, fallback to random moves.
KATAGO_PATH: "/home/oppa-ai/KataGo/cpp/katago"
KATAGO_MODEL: "/home/oppa-ai/KataGo/models/kata1-b10c128-s1141046784-d204142634.txt.gz"
KATAGO_CONFIG: "/home/oppa-ai/KataGo/cpp/configs/gtp_example.cfg"

# -- Go banter (same social gate as Shogi: notable moments + occasional lines) --
GO_BANTER: "1"  # 1/true/yes/on to enable; 0 = silent template comments only.
GO_BANTER_FREQUENCY: "0.25"  # Odds of a line on a quiet move (0 = notable moments only, 1 = every move).

# -- Koi-Koi banter (yaku, koi-koi calls, stops, dealt yaku, round/match end) --
KOIKOI_BANTER: "1"  # 1/true/yes/on to enable; 0 = silent template comments only.
KOIKOI_BANTER_FREQUENCY: "0.25"  # Odds of a line on a quiet turn.

# -- Koi-Koi Aiko-leads experiment (LLM picks, engine vetoes) --
KOIKOI_AIKO_LEADS: "1"  # Aiko chooses her own plays; engine overrules picks >1.5 pts off best. Adds one LLM call per AI turn; 0 = pure heuristic.

# -- Lingo vocab spawn pool (server side, used by Aiko-Lingo Learn) --
LINGO_SPAWN_BATCH: "20"  # LLM-spawned vocab items per top-up batch.
LINGO_POOL_MIN: "30"  # Minimum pooled items per JLPT level before top-up triggers.

# -- Public base URL (Android audio URLs, TTS callbacks) --
AIKO_PUBLIC_BASE_URL: ""  # blank = use live request host, then auth REDIRECT_BASE.
