# config/conscience.yaml
#
# Conscience Circuit Core tunables. Flattened into os.environ by
# system.config.load_config() like every other config/*.yaml — remember to add
# "conscience.yaml" to config/index.yaml's `configs:` list.
#
# Naming follows the CCC_* prefix so `env | grep CCC_` shows the whole circuit.

CCC:
  # Master switch. Off => evaluate() returns a permissive verdict with
  # gate="disabled" and costs one boolean check.
  ENABLED: 1

  # Constitution version. Recorded on every ledger row so decisions can be
  # replayed against a revised canon. Bump whenever canon.seed.jsonl changes.
  CANON_VERSION: "1.0.0"

  # ── salience floor ────────────────────────────────────────────────────────
  # Turns below this never enter the circuit (greetings, acknowledgements,
  # trivially short input). Keeps the gate off the hot path for ~60% of turns.
  MIN_CHARS: 12
  SKIP_GREETINGS: 1

  # ── layer ladder ──────────────────────────────────────────────────────────
  # 0 = reflex only, 1 = +recall, 2 = +SLM judge, 3 = +LLM deliberation,
  # 4 = +human escalation. Lower this to degrade gracefully under load.
  MAX_LAYER: 4

  # Escalate to L3 deliberation when the L2 judge is below this confidence.
  DELIBERATE_THRESHOLD: 0.62
  # Escalate to a human when, after L3, confidence is still below this.
  HITL_THRESHOLD: 0.45
  # Doubt rule (Rom 14:23): an unresolved escalation resolves to refuse, never
  # to allow. Seconds to wait for a human before the default-closed timeout.
  HITL_TIMEOUT_SECONDS: 900
  HITL_DEFAULT: "refuse"

  # ── verdict thresholds ────────────────────────────────────────────────────
  # Either axis at or below REFUSE_AT (with confidence) => refuse.
  REFUSE_AT: -0.60
  # Either axis at or below CAUTION_AT => caution.
  CAUTION_AT: -0.20
  # Disagreement between the two axes wider than this is treated as unresolved
  # regardless of confidence (e.g. "good for the user, bad for a third party").
  AXIS_CONFLICT_GAP: 0.80

  # Which question vocabulary the deployed checkpoint is asked. MUST match the
  # checkpoint it talks to, and it differs by host: v5 answers
  # aligned/contrary/unknown + benefits/unknown/harms; the 3x2 fine-tune answers
  # permitted/not-permitted/cannot-tell + no-harm/harm. Asking 3x2 the legacy
  # question makes it emit band names that then read as a real negative --
  # measured: four passing tests escalated on Jetson.
  #
  # Keys in this block carry no CCC_ prefix; the loader adds it. Living here
  # rather than in a systemd unit matters because the process that asks the
  # question is AIKO, not the model server.
  JUDGE_SCHEME: triage
  # ── approval band knob: stricter ↔ looser ──────────────────────────
  # BAND_HI is the refuse threshold; the ask zone is [BAND_LO, BAND_HI).
  # Lower hi refuses more (higher recall, more false refuses, fewer asks);
  # higher hi refuses less (false refuses become owner asks instead).
  # Measured on locked-100 (honest set):
  #   stricter: BAND_HI: 0.60 → FP 11.5%, recall 71%, ask 16%
  #   current:  BAND_HI: 0.75 → FP 3.8%,  recall 52%, ask 29%
  #   looser:   BAND_HI: 0.85 → FP 1.9%,  recall 31%, ask 40%
  # BAND_LO (auto-allow below it): 0.40 measured; raising it asks more,
  # lowering it allows more. Env (e.g. systemd Environment=CCC_BAND_HI=...)
  # still wins over this file.
  BAND_HI: 0.75

  # ── 2x2 negative ladder ──────────────────────────────────────────────────
  # The judge answers two BINARY questions -- does the ACT break a commandment,
  # does it HARM a neighbour -- and reports per-axis confidence. Bands carry
  # polarity; confidence carries ambiguity. Oppa's rule: doubt fails closed.
  #
  #   negative on either axis            -> ask
  #   not-negative but below DOUBT        -> ask
  #   both not-negative, above DOUBT     -> proceed
  #
  # Confidence is deliberately NOT used to grade severity. Certainty about a
  # band is not the same axis as how bad the act is: "I brought the office paper
  # home" scores 0.74 confidence, "help me pick this lock" scores 0.51, and
  # ordering those by confidence would refuse the triviality. Refusal stays with
  # the deterministic tiers (guardrails + canon polarity), so BLOCK defaults off.
  #
  # DOUBT is the number to calibrate: too high and Aiko asks about everything
  # (measured 91% of benign traffic escalated at v5's settings); too low and doubt
  # stops failing closed.
  NEGATIVE_BLOCK_CONFIDENCE: 0.0   # 0 = off; refusal is rule-based only
  NEGATIVE_ASK_CONFIDENCE: 0.0     # 0 = off; any negative escalates
  NEGATIVE_DOUBT_CONFIDENCE: 0.50

  # ── tool policy ───────────────────────────────────────────────────────────
  # Any caution on an irreversible tool is upgraded to escalate.
  IRREVERSIBLE_REQUIRES_APPROVAL: 1
  # Irreversible AND outward-facing (scope external/public/network) goes to a
  # human even on a clean verdict. This is the excessive-agency control; turn
  # it off only if you genuinely want Aiko posting unsupervised.
  ESCALATE_IRREVERSIBLE_EXTERNAL: 1
  # Tools always routed through a human regardless of verdict.
  ALWAYS_APPROVE_TOOLS:
    - post_social
    - post_x
    - post_threads
    - send_email
    - github_push
    - delete_memory
    - clear_memory

  # ── canon retrieval ───────────────────────────────────────────────────────
  CANON_PATH: "data/conscience/canon.seed.jsonl"
  CANON_TOP_K: 6
  # Use the shared HarrierEmbedder for semantic norm retrieval. When 0, falls
  # back to lexical (token overlap) retrieval only — no embed call on the gate.
  # INTERIM (no SLM trained yet): 0. Lexical triggers still hard-refuse the
  # serious cases, while paraphrase-level guessing — which only a model reader
  # can judge fairly — stays off until the SLM is deployed. Set back to 1 then.
  CANON_SEMANTIC: 0
  CANON_CACHE_TTL: 300.0
  # Shrink judge confidence when fewer than this many norms were retrieved.
  THIN_EVIDENCE_MIN: 2
  THIN_EVIDENCE_PENALTY: 0.25

  # ── conscience SLM (L2) ───────────────────────────────────────────────────
  # Second llama-server instance (e.g. `llama-server -m
  # <conscience-qwen35-08b.gguf> --port 8084`). It must be its own server,
  # INTERIM (no SLM trained yet): empty = run on the lexical scorer alone.
  # Safe since the weak-evidence cap (core.py) forces low-confidence reads to
  # escalate instead of refusing. Set the URL once the model is deployed.
  SLM_BASE_URL: ""
  SLM_MODEL: "conscience-qwen35-08b"
  SLM_MAX_TOKENS: 96
  SLM_TIMEOUT: 2.5
  SLM_TEMPERATURE: 0.0
  # Blend weight between SLM score and lexical score when both are available.
  # 1.0 = trust the SLM entirely, 0.0 = ignore it.
  SLM_WEIGHT: 0.75

  # ── conscience Laya judge (L2, typed decisions) ───────────────────────────
  # The fine-tuned Laya checkpoint does not generate text: it answers typed
  # `choice` questions at POST {LAYA_BASE_URL}{LAYA_DECIDE_PATH} and returns
  # probabilities. Use this INSTEAD of SLM_* when the checkpoint is deployed;
  # it is calibrated (ECE ~0.05-0.08) where the generative SLM is not.
  # Empty = tier stays off and the ladder runs on the lexical scorer.
  # NOT a chat/completions endpoint -- Laya has no /v1/chat/completions.
  LAYA_BASE_URL: "http://127.0.0.1:8093"   # live: laya serve on :8093 (see systemd/README)
  LAYA_MODEL: ""              # empty = omit the field; else the server's INTERNAL name
  LAYA_DECIDE_PATH: "/v1/decide"
  LAYA_TIMEOUT: 2.5
  # Strikes before the breaker opens, so a dead endpoint costs nothing per-turn.
  LAYA_FAILURE_LIMIT: 3

  # ── autonomy policy (how often she may act without asking) ────────────────
  # Learned ONLY from explicit approvals. Cannot widen a conscience verdict,
  # and high-stakes classes never graduate regardless of approval count.
  AUTONOMY_ENABLED: "1"
  AUTONOMY_THRESHOLD: 5        # consecutive approvals -> standing permission
  AUTONOMY_NOTIFY_THRESHOLD: 2 # approvals -> act and mention it
  AUTONOMY_DECAY_DAYS: 14      # trust expires; only explicit approval renews
  AUTONOMY_MAX_HISTORY: 50

  # ── L3 deliberation (main LLM) ────────────────────────────────────────────
  DELIBERATE_MODEL: ""        # empty => reuse LLM_MODEL
  DELIBERATE_MAX_TOKENS: 1024 # thinking models burn budget reasoning first; 220 starves verdicts
  DELIBERATE_TIMEOUT: 90.0

  # ── speech policy ─────────────────────────────────────────────────────────
  # Never volunteer moral commentary. A pastoral_note is voiced only on a
  # refusal (where Aiko owes an explanation) or when explicitly asked.
  # Setting this to 1 makes her preachy and will wreck the companion tone.
  VOICE_UNSOLICITED_NOTES: 0
  # Max chars of the refusal explanation folded into the prompt.
  NOTE_MAX_CHARS: 240

  # ── ledger ────────────────────────────────────────────────────────────────
  LEDGER_ENABLED: 1
  LEDGER_DB_PATH: "memory/conscience.db"
  # Store the raw content of the judged act. 0 = store only a SHA-256 digest
  # plus the verdict (safer on a shared box; useless for training).
  LEDGER_STORE_CONTENT: 1
  LEDGER_RETAIN_DAYS: 365

  # ── safeguards (L0) ───────────────────────────────────────────────────────
  # Rule families in guardrails.py. Disable individually by id prefix.
  GUARDRAILS_ENABLED: 1
  GUARDRAIL_DISABLED_RULES: ""     # comma-separated rule ids, e.g. "SG-PRIV-02"
  # Treat a guardrail hit on outbound content as refuse (1) or caution (0).
  GUARDRAIL_EGRESS_STRICT: 1
