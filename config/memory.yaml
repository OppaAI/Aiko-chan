# Learned knowledge vector-store config
#
# Settings for cognition/knowledge/ (schema.py + ingest.py), Aiko's machine-writable
# RAG store for durable learned facts, user-ingested document/PDF text, and self-learning
# research notes. This is separate from agentic/wiki.py, which indexes
# human-authored wiki/skill/persona/config files.

KNOWLEDGE_DB_PATH: "knowledge/knowledge.db"  # Relative paths are stored under the active user's state dir; encrypted when SQLITE_ENCRYPTION=1.
KNOWLEDGE_WORKSPACE_DIR: ""  # Default ~/.aiko/<user_id>/library; empty = use code default
KNOWLEDGE_STORE_CHUNK_CHARS: "900"  # Chunk size at ingest time; chunks are embedded once and stored individually.
KNOWLEDGE_CONTEXT_CHARS: "3500"  # Max learned-knowledge context characters injected into a prompt.
KNOWLEDGE_KNN_LIMIT: "20"  # sqlite-vec semantic candidates before RRF fusion.
KNOWLEDGE_FTS_LIMIT: "20"  # FTS5 lexical candidates before RRF fusion.
KNOWLEDGE_RRF_K: "60"  # Reciprocal Rank Fusion constant; higher dampens rank differences.
KNOWLEDGE_RECALL_SCORE_THRESHOLD: "0.012"  # Minimum fused score for a learned chunk to be injected.
KNOWLEDGE_QUERY_INSTRUCT: "Retrieve durable learned knowledge relevant to the request"

# Phase 8: entity tags + relate
KNOWLEDGE_ENTITY_BOOST: "0.003"  # Soft search boost when query overlaps chunk entities.
KNOWLEDGE_WRITE_DEDUP_THRESHOLD: "0.95"  # Cosine ≥ this → skip near-dup chunk (same ingest). 0 disables.

# Learn config
#
# Settings for cognition/memory/learn.py — Aiko's two research depths (quick_studying,
# deep_studying) and the idle learner loop that decides when to run them.
# Both depths sit on top of agentic/toolkit/research.py's primitives
# (see web.yaml for the shared search/fetch/condense tunables they inherit).

# -- idle learner loop (when Aiko is allowed to self-study at all) --
IDLE_LEARNER_CHECK_INTERVAL: "300"  # How often (seconds) the loop wakes up to check idle conditions. Doesn't trigger study by itself.
IDLE_LEARN_SECONDS: "1800"  # Short-idle threshold. Once chat has been quiet this long (and TTS isn't playing), the loop is allowed to run QUICK study. 30 min default — "I'm around but not talking right now."
DEEP_IDLE_LEARN_SECONDS: "7200"  # Long-idle threshold. Once chat has been quiet THIS long, the loop escalates to DEEP study instead of quick. 2 hr default — "I'm at work / asleep." NOTE: not yet read by learn.py — idle_learner_loop currently only checks IDLE_LEARN_SECONDS and always calls quick_studying; this is the knob to wire up when the two-depth escalation logic gets built.

# -- topic queue (planned, not yet implemented) --
# The intent: give Aiko a standing list of topics instead of inferring one
# from the last chat message. Quick study pulls the current topic, may not
# finish it in one pass, and should resume the SAME topic next idle window
# instead of restarting. Deep study works a topic across many differently-
# angled sub-queries until it has an answer, then advances the queue.
# None of this state (current topic pointer, partial-progress record,
# per-topic "answered" flag) exists in learn.py yet — these are placeholders
# for when that gets built, not live settings.
# LEARN_TOPIC_QUEUE_PATH: "~/.aiko/learn_topics.json"  # Ordered topic list + resume pointer. TODO.
# LEARN_TOPIC_RESUME_ENABLED: "true"  # Whether quick_studying should resume a partial topic rather than always taking the latest chat message. TODO.

# -- quick_studying (thin alias over adaptive_search; interactive-scale) --
QUICK_STUDY_MAX_ROUNDS: "5"  # Passed as max_rounds to adaptive_search. Quick study can explore deeper than adaptive_search's default (2) since it's an offline idle activity.

# -- deep_studying (autonomous, long-running; genuine idle/overnight) --
DEEP_STUDY_MAX_ITERATIONS: "10"  # Hard ceiling on search+fetch iterations for one deep_studying() call. Starting point per your request — was 60. Raise once you've seen how long 10 iterations actually takes on the Jetson's Ministral-3B and how it feels alongside RAM headroom; 60 is likely too many for AuRoRA's 8GB unified memory to sustain unattended.
DEEP_STUDY_SEED_QUERIES: "6"  # How many concrete sub-queries the model breaks the topic into up front, explored before the adaptive next-query loop kicks in. Keep this comfortably below MAX_ITERATIONS (currently is) so there's still budget left for adaptive follow-ups.
DEEP_STUDY_RESULTS_PER_QUERY: "3"  # SearXNG results considered per sub-query. Falls back to web.yaml's SEARXNG_MAX_RESULTS if unset.
DEEP_STUDY_FETCH_TOP: "3"  # How many of those results actually get fetched per iteration.
DEEP_STUDY_MAX_CHARS_PER_PAGE: "2000"  # Per-page fetched text cap, same role as CONDENSE_CHUNK_CHARS but scoped to deep_studying's own fetch calls.
DEEP_STUDY_CHUNK_CHARS: "500"  # Chunk size fetched pages are split into before scoring/storing. Falls back to web.yaml's CONDENSE_CHUNK_CHARS if unset.
DEEP_STUDY_MIN_SCORE: "0.15"  # Minimum relevance score for a chunk to survive into distillation. Falls back to web.yaml's CONDENSE_MIN_SCORE if unset.
DEEP_STUDY_TOP_K_FOR_DISTILLATION: "40"  # Max ranked chunks handed to the final synthesis call, scored against the ORIGINAL topic (not individual sub-queries). Lower this if 40 excerpts is more than DEEP_STUDY_SYNTHESIS_MAX_TOKENS can meaningfully use.
DEEP_STUDY_PER_HOST_MIN_INTERVAL: "3.0"  # Minimum seconds between fetches to the same host across the whole session — politeness guard so many iterations can't hammer one domain (e.g. a project's own GitHub) repeatedly.
DEEP_STUDY_SCRATCH_DIR: ""  # Disk-backed scratch SQLite location for the duration of ONE deep_studying() call. Deleted when the call returns — not a persistent index. Long-term storage of results is the caller's job via the on_distilled hook.
DEEP_STUDY_DECISION_MAX_TOKENS: "250"  # Token budget for each "what's the next sub-query, or should we stop" decision call.
DEEP_STUDY_SYNTHESIS_MAX_TOKENS: "900"  # Token budget for the final distillation/synthesis call over the top-K ranked chunks.

# Memorize config
#
# Settings for cognition/memory/memorize.py, cognition/memory/vecstore.py, cognition/memory/forget.py, and cognition/consolidate/backend.py.
# Tune local sqlite memory, embedding model behavior, memory decay, and monthly consolidation here.

# -- Storage and embedding endpoint --
EDGE_COGNITION_ENABLED: "1"  # Bounded process-local focus/open-loop state; no I/O or model call.
EDGE_COGNITION_MAX_TURNS: "10"  # Human-like working set, hard bounded per user.
EDGE_COGNITION_MAX_CHARS: "1200"  # Prompt budget for the fast cognitive state.
EDGE_COGNITION_MAX_OPEN_LOOPS: "3"  # Pending questions/tasks carried forward.
EDGE_COGNITION_MAX_GOALS: "5"  # Active intentions carried forward in the fast state.
EDGE_COGNITION_MAX_IDENTITIES: "16"  # Hard RAM bound across concurrent users.

SQLITE_MEMORY_PATH: ""  # Optional override; blank uses per-user ~/.aiko/<user_id>/memory/memory.db.
EMBED_BASE_URL: "http://127.0.0.1:8080"  # Embedding server base URL used by cognition/memory/vecstore.py.
EMBED_MODEL: "harrier"  # Embedding model id/alias; must match server/custom embedder.
EMBED_DIMS: "640"  # Vector dimensions; must match embedding model and sqlite-vec schema.
EMBED_QUERY_INSTRUCT: "Retrieve relevant memories that answer the query"  # Instruction prefix used for query embeddings; memories/documents stay unprefixed.
EMBED_BATCH_SIZE: "16"  # Embedding batch size for migration/rebuild scripts; lower if memory pressure is high. Reduced from 64 for Jetson 8GB.
EMBED_TIMEOUT_S: "30"  # Seconds before embedding HTTP calls time out.
EMBED_CACHE_PATH: "~/.aiko/embedding_cache"  # Disk cache for embeddings across restarts.
FASTEMBED_CACHE_PATH: ""  # Legacy FastEmbed cache fallback; blank if unused.

# -- Memory extraction and recall --
MEMORY_EXTRACT_MIN_CHARS: "80"  # Minimum turn length before extracting a memory fact.
MEMORY_EXTRACT_MAX_TOKENS: "128"  # Max tokens for memory extraction summaries.
MEMORY_EXTRACT_TIMEOUT: "18"  # Seconds before memory extraction LLM call times out.
EXTRACT_MODEL: ""  # Optional smaller model for extraction; blank falls back to LLM_MODEL.
MEMORY_RECALL_LIMIT: "3"  # Number of memories injected into normal chat context.
MEMORY_MIN_SCORE: "0.0"  # Minimum recall score (same scale as MEMORY_RECALL_SCORE_THRESHOLD below, ~0.015) a memory must clear to be included in context. 0 = off, no memory dropped for being weak.
WRITE_DEDUP_THRESHOLD: "0.92"  # Similarity threshold above which a new memory write is skipped as duplicate OR supersedes different text; range 0.0-1.0. Phase A: same norm text → noop; high cosine but different text → supersede (old status=superseded). No extra LLM.
MEMORY_WRITE_IDLE_GRACE: "3.0"  # Seconds of idle chat before background memory writes proceed.
MEMORY_WRITE_MAX_WAIT: "45.0"  # Max seconds memory writer waits before forcing the write.
MEMORY_VECTOR_BACKFILL_LIMIT: "200"  # Max memories re-embedded per backfill pass when the embedder recovers from an outage.

# -- Phase A metadata (auto-migrated; no rebuild) --
# Columns: status, supersedes_id, kind, source, entities.
# Offline migrate: uv run python -m util.migrate_memory_phase_a

# -- Phase B entity tags + unified search (no rebuild, no extra LLM) --
# Rule-based entity extract + kind on write. Optional backfill:
#   uv run python -m util.migrate_memory_phase_b --dry-run
#   uv run python -m util.migrate_memory_phase_b
# Unified facade: from cognition.memory import search_memory
MEMORY_ENTITY_BOOST: "0.003"  # Soft score boost when query text mentions a tagged entity on a personal memory.

# -- Phase 3: entity importance + supersession chain --
# I_e = (1-α)·centrality + α·recency; used in monthly R and mild recall boost.
ENTITY_IMPORTANCE_ALPHA: "0.4"  # Blend weight for recency vs structural centrality (0=centrality only).
ENTITY_IMPORTANCE_BETA: "0.05"  # Per-day recency decay for entity last-touch.
ENTITY_IMPORTANCE_CACHE_TTL: "60.0"  # Seconds a user's entity-importance map is cached before recompute (it full-scans memories + entity_relations; writes invalidate it immediately).
MEMORY_RANK_ENTITY_IMPORTANCE_WEIGHT: "0.008"  # Flat recall score boost × max I_e on a memory; 0 disables.
MEMORY_SUPERSESSION_CHAIN_EXPAND: "1"  # Expand supersedes_id lineage on reflective / identity-plan hits.
MEMORY_SUPERSESSION_CHAIN_KINDS: "identity,preference,plan"  # Kinds that always expand chain when hit.

# -- Phase 9: spreading activation --
MEMORY_SPREADING_ENABLED: "1"  # Walk entity_relations from entry hits; 0 disables.
MEMORY_SPREADING_MAX_DEPTH: "2"  # Hops from seed entities.
MEMORY_SPREADING_DECAY: "0.6"  # Multiplier per hop on edge weight.
MEMORY_SPREADING_MIN_STRENGTH: "0.15"  # Drop entities below this activation.
MEMORY_SPREADING_MAX_EXTRA: "2"  # Max neighbor memories added beyond RRF hits.
MEMORY_SPREADING_SCORE_WEIGHT: "0.003"  # Flat boost × max entity activation on a row.
MEMORY_RANK_GRAPH_WEIGHT: "0.2"  # Entity-graph recall tiebreaker; adds weight/(RRF_K+rank) per row with a graph hit. 0 disables.
QUICK_GRAPH_LIMIT: "6"  # Narrow graph-pass candidate count tried before falling back to full search.
MEMORY_GRAPH_SUPER_NODE_FRACTION: "0.2"  # Share of top-freq entities treated as a fused super-node during graph fusion.
MEMORY_GRAPH_SUPER_NODE_TTL: "3600"  # Seconds the high-frequency entity super-node cache is considered fresh.

# -- Phase 4: turn-level valence + salience tags --
MONTHLY_CONSOLIDATION_W_VALENCE: "0.10"  # Weight for |emotional intensity|. Neuroscience: high-valence ↔ fast consolidation.
# Paper I §5.2 weights (salience/novelty/spacing/connectivity), with W_VALENCE blended in.
MONTHLY_CONSOLIDATION_W_SALIENCE: "0.30"  # User-tagged importance or story-weight (e.g. "first piano recital").
MONTHLY_CONSOLIDATION_W_NOVELTY: "0.25"  # Semantic distance from existing memories. Surprise/contradiction factor.
MONTHLY_CONSOLIDATION_W_SPACING: "0.20"  # Time gaps between repeated retrievals. Spaced-rep principle.
MONTHLY_CONSOLIDATION_W_CONNECTIVITY: "0.25"  # In-graph degree. Well-connected memories survive consolidation.

# -- Phase 6: dynamic anchors --
# Novelty = W_STATIC·(distance to prior [YYYY-MM] archive anchors) +
#           W_DYNAMIC·(distance to mean of recently-active memory vectors).
# The dynamic anchor captures whether a fact is already represented by what's
# currently hot — a coherent extension of the paper's static-anchor novelty.
MONTHLY_CONSOLIDATION_NOVELTY_W_STATIC: "0.6"  # Share of novelty from prior [YYYY-MM] static anchors.
MONTHLY_CONSOLIDATION_NOVELTY_W_DYNAMIC: "0.4"  # Share of novelty vs recent active-memory mean (dynamic anchor).
MONTHLY_CONSOLIDATION_DYNAMIC_ANCHOR_LIMIT: "40"  # Max recent active facts to build the dynamic anchor mean.
MONTHLY_CONSOLIDATION_DYNAMIC_ANCHOR_DAYS: "14"  # Prefer facts touched/created within this many days.
MONTHLY_CONSOLIDATION_ANCHOR_LOOKBACK: "50"  # Max prior [YYYY-MM] archive anchors to compare against for static novelty.
MONTHLY_CONSOLIDATION_ANCHOR_K: "5"  # Nearest archive anchors kept when scoring static novelty.
MONTHLY_CONSOLIDATION_SPACING_SATURATION: "5"  # Spacing score saturates once access_day_count reaches this many distinct days.

# -- Phase 5: emotion imprint on decay + dream --
FORGET_EMOTION_GAMMA: "0.25"  # H_eff = H * (1 + gamma * intensity); 0 disables emotion-modified decay.
FORGET_INTENSITY_NEG: "1.0"  # intensity for valence_tag=neg (sticky imprint).
FORGET_INTENSITY_POS: "0.4"  # intensity for valence_tag=pos.
FORGET_INTENSITY_NEUTRAL: "0.0"  # 0 = neutral is not emotional; does not extend effective half-life.
DREAM_BOOST_USE_STORED_TAGS: "1"  # Prefer salience_hit / valence_tag over text-only heuristics in dream boost.

# -- Phase 13: cross-store chain (append to config/memory.yaml) --
MEMORY_CROSS_STORE_ENABLED: "1"  # Attach related knowledge/experience after personal memory recall.
MEMORY_CROSS_STORE_MAX_KNOWLEDGE: "2"  # Max knowledge chunks attached per recall.
MEMORY_CROSS_STORE_MAX_EXPERIENCE: "2"  # Max experience rows attached per recall.
MEMORY_CROSS_STORE_MIN_ENTITY_OVERLAP: "1"  # Min shared entities to keep a related hit (0 = score-only).
MEMORY_CROSS_STORE_CONTEXT_CHARS: "800"  # Max chars for related_* blocks in context.

# Studio layers
MEMORY_STUDIO_INCLUDE_KNOWLEDGE: "1"  # Export learned_chunks as knowledge nodes.
MEMORY_STUDIO_INCLUDE_EXPERIENCE: "1"  # Export experiences as experience nodes.
MEMORY_STUDIO_MAX_KNOWLEDGE: "80"  # Cap knowledge nodes in graph payload.
MEMORY_STUDIO_MAX_EXPERIENCE: "40"  # Cap experience nodes in graph payload.
MEMORY_STUDIO_INCLUDE_EPISODES: "1"  # Export emc_storage as episode nodes
MEMORY_STUDIO_MAX_EPISODES: "80"     # Cap episode nodes in graph payload

# -- Decay and dream merge --
FORGET_HALF_LIFE_DAYS: "21"  # Days until memory retention score halves.
FORGET_ACCESS_COUNT_CAP: "255"  # Maximum access_count retained for decay scoring.
FORGET_CLEANUP_THRESHOLD: "0.02"  # Decay score below which cleanup may prune a memory.
FORGET_GRACE_PERIOD_DAYS: "35"  # Minimum age before ordinary memories can be cleaned up.
DREAM_MERGE_THRESHOLD: "0.90"  # Similarity threshold for merging near-duplicate memories; range 0.0-1.0.
DREAM_BOOST_AMOUNT: "1"  # Access-count boost for memories promoted during dream/reflection.

# -- Phase 12R / 14a: 5-point valence (−2…+2) --
# Stored as memories.valence_score; valence_tag kept for legacy (pos/neg/neutral).
# Intensity for forget = |score| / 2. Inference: emoji + lexicon + intensifiers (no LLM).
# FORGET_INTENSITY_* still apply when only valence_tag is present (old rows).
# -- Search ranking and context budget --

MEMORY_SEARCH_CACHE_SIZE: "128"  # Max number of memory search results cached in-process.
MEMORY_SEARCH_CACHE_TTL: "20.0"  # Seconds before cached memory search result expires.
MEMORY_RANK_RECENCY_WEIGHT: "0.004"  # Small retrieval boost for recent memories (continuous blending, applies to every candidate).
MEMORY_RANK_RECENCY_HALF_LIFE_DAYS: "30"  # Days for recency boost to halve.
MEMORY_RANK_ACCESS_WEIGHT: "0.002"  # Small retrieval boost for frequently recalled memories.
MEMORY_RANK_PINNED_WEIGHT: "0.02"  # Small retrieval boost for pinned memories.
MEMORY_CONTEXT_FACT_CHARS: "220"  # Max characters per individual memory fact injected into context.
MEMORY_CONTEXT_TOTAL_CHARS: "1200"  # Total character budget for all memory facts injected per turn.
MEMORY_LIFECYCLE_BATCH_SIZE: "200"  # Memories processed per batch during cleanup/decay lifecycle runs. Reduced from 500 for lower memory pressure.

# -- Tiered recall (quick/wide) --
QUICK_KNN_LIMIT: "6"  # Narrow KNN candidate count tried before falling back to full search.
QUICK_FTS_LIMIT: "6"  # Narrow FTS5 candidate count tried before falling back to full search.
MEMORY_RECALL_SCORE_THRESHOLD: "0.015"  # Min final-rank score required at position `limit` for the quick pass to be accepted; below this, search widens to KNN_LIMIT/FTS_LIMIT.

# -- vec0 MATCH KNN oversampling --
KNN_MATCH_OVERSCAN: "8"  # Multiply the caller's k by this before the vec0 scan, since user/status filters apply after the scan. Reduced from 16 for faster KNN on Jetson.
KNN_MATCH_K_MIN: "16"     # Absolute floor for the oversampled k. Reduced from 32.

# -- Pinned recency-among-relevant rerank --
MEMORY_RECENCY_RERANK_ENABLED: "1"  # Toggle recency-among-relevant reranking; boolean options (1/0, true/false, yes/no, on/off).
MEMORY_RECENCY_RERANK_THRESHOLD: "0.012"  # Min final score for a candidate to be considered "relevant enough" to be reordered by recency instead of by raw score.

# -- Experience and consolidation --
MONTHLY_CONSOLIDATION_ENABLED: "1"  # Monthly consolidation toggle; options: 1/0, true/false, yes/no, on/off.
MONTHLY_CONSOLIDATION_KEEP_MONTHS: "1"  # Number of recent full months to keep as detailed memories.
MONTHLY_CONSOLIDATION_SOFT_THRESHOLD: "0.44"  # Min retention-gate score to survive consolidation; weights max out at ~1.1 (paper weights + valence).
MONTHLY_CONSOLIDATION_CHUNK_MEMS: "25"  # Memory facts per fallback monthly summary chunk.
MONTHLY_CONSOLIDATION_MAX_INPUT_CHARS: "6000"  # Max source chars per monthly consolidation LLM request.
MONTHLY_CONSOLIDATION_DELETE_DAILY_SUMMARIES: "0"  # After folding a month's pinned daily facts/day-records into "[YYYY-MM] ..." consolidated facts, delete the daily-granularity originals. Set to 0 to keep consolidation purely additive (compress + archive, no deletion) until you've verified retrieval/growth behavior.
MONTHLY_CONSOLIDATION_MIN_MEMS: "5"  # Skip fallback months with fewer memories than this.
MONTHLY_CONSOLIDATION_MIN_MONTH: "8"  # Floor on how many month candidates the retention gate considers before consolidation.
MONTHLY_CONSOLIDATION_MAX_MONTH: "30"  # Cap on month candidates scanned per consolidation pass.
MONTHLY_CONSOLIDATION_LLM_TIMEOUT: "120"  # Seconds before monthly summary LLM calls time out.
MONTHLY_CONSOLIDATION_STATE_PATH: ""  # Optional override; blank uses per-user ~/.aiko/<user_id>/monthly_consolidation_state.jsonl.

# -- Phase 7: journal promote + safer day-pin delete --
MONTHLY_CONSOLIDATION_JOURNAL_PROMOTE: "0"  # Promote top journal fragments into day pins before the retention gate.
MONTHLY_CONSOLIDATION_JOURNAL_PROMOTE_K: "4"  # Max journal lines promoted per month (selective, not random).
MONTHLY_CONSOLIDATION_DELETE_REQUIRE_COVERAGE: "1"  # Require soft archival coverage before deleting day pins.
MONTHLY_CONSOLIDATION_DELETE_MIN_WRITTEN: "1"  # Min [YYYY-MM] facts written before delete is allowed.
MONTHLY_CONSOLIDATION_DELETE_MIN_RATIO: "0.15"  # Min facts_written / len(kept_rows); else skip delete.

# Experience vector-store config
#
# Settings for agentic/experience.py, Aiko's machine-written procedural trace of
# completed agentic tasks. Experience stores sanitized goal -> steps -> outcome
# records for later RAG recall. It does not use memory forgetting/decay.

EXPERIENCE_DB_PATH: "experience/experience.db"  # Relative paths live under the active user's state dir; encrypted when SQLITE_ENCRYPTION=1.
EXPERIENCE_CONTEXT_CHARS: "2500"  # Max similar-task context characters injected into task mode.
EXPERIENCE_KNN_LIMIT: "20"  # sqlite-vec semantic candidates before RRF fusion.
EXPERIENCE_FTS_LIMIT: "20"  # FTS5 lexical candidates before RRF fusion.
EXPERIENCE_RRF_K: "60"  # Reciprocal Rank Fusion constant; higher dampens rank differences.
EXPERIENCE_RECALL_SCORE_THRESHOLD: "0.012"  # Minimum fused score for a past task to be injected.
EXPERIENCE_MAX_ROWS: "10000"  # Hard cap per user; lowest-scored/oldest rows are pruned only to limit noise/storage.
EXPERIENCE_QUERY_INSTRUCT: "Retrieve similar past agentic task runs"
EXPERIENCE_ENTITY_BOOST: "0.003"
EXPERIENCE_AUTO_RELATE_THRESHOLD: "0.90"  # Auto engram link if similar past run ≥ this; 0 disables.

# -- Phase 10: Memory Graph Studio --
MEMORY_STUDIO_MAX_MEMORIES: "400"  # Max memory nodes in galaxy payload.
MEMORY_STUDIO_MAX_ENTITIES: "120"  # Max entity nodes.
MEMORY_STUDIO_MAX_EDGES: "200"  # Max co-mention + mention edges.

# -- Phase 11: hard source-id provenance before day-pin delete --
MONTHLY_CONSOLIDATION_HARD_SOURCE_PROVENANCE: "1"  # Require every kept day-pin id in some LLM source_ids before delete. Soft coverage still applies. 0 = soft only.
# Phase 15
MEMORY_VALENCE_FROM_LLM: "1"   # use extract valence_score when present
# Studio curves live in graph_export / index.html for now

# -- Phase 16: human-feel recall --
MEMORY_STATE_TAGS_ENABLED: "1"
MEMORY_NEG_RECALL_AVOID: "1"
MEMORY_NEG_RECALL_AVOID_WEIGHT: "0.015"   # subtract from rank when avoid applies
MEMORY_NEG_RECALL_AVOID_EXCEPT: "1"      # skip avoid if query looks emotional/reflective
MEMORY_SUPERSESSION_NARRATIVE: "1"
MEMORY_SUPERSESSION_NARRATIVE_MAX: "2"   # max chains to narrate per turn

# -- Phase 17: session novelty (turn-level dynamic anchor) --
# Ring buffer of last-K query embeddings per user (in-process). Rank mildly
# boosts memories similar to that mean ("hot in this chat"). Monthly dynamic
# novelty is unchanged. Existing MEMORY_RANK_RECENCY_* still provides light
# continuous recency in rank.
MEMORY_SESSION_ANCHOR_ENABLED: "1"
MEMORY_SESSION_ANCHOR_K: "8"           # Last K query vectors in this process/session
MEMORY_SESSION_ANCHOR_WEIGHT: "0.006"  # Cosine-to-session-mean boost (same order as rank recency)

# -- Phase 18: knowledge / experience store parity --
# Near-dup writes can supersede older rows (status=superseded + supersedes_id).
# Optional entity/engram spreading is OFF by default (enable if desired).
KNOWLEDGE_SUPERSEDE_ON_DEDUP: "1"       # 1 = supersede near-dup instead of skip
KNOWLEDGE_SPREADING_ENABLED: "0"
KNOWLEDGE_SPREADING_MAX_EXTRA: "2"
KNOWLEDGE_SPREADING_SCORE_WEIGHT: "0.003"
EXPERIENCE_SUPERSEDE_ON_NEAR_DUP: "1"
EXPERIENCE_SUPERSEDE_THRESHOLD: "0.95"  # cosine sim to mark older run superseded
EXPERIENCE_SPREADING_ENABLED: "0"
EXPERIENCE_SPREADING_MAX_EXTRA: "2"
EXPERIENCE_SPREADING_SCORE_WEIGHT: "0.003"

# -- Phase 19: arousal + neg hard filter + lineage --
MEMORY_AROUSAL_ENABLED: "1"           # Write/rank arousal_score (−2..+2).
MEMORY_AROUSAL_RANK_WEIGHT: "0.01"    # Small additive rank term: weight * |arousal|/2.
MEMORY_NEG_HARD_FILTER: "1"           # Exclude strong-neg from unsolicited context inject.
MEMORY_NEG_HARD_THRESHOLD: "-1"       # valence_score <= this counts as sticky-neg.
MEMORY_LINEAGE_MAX_DEPTH: "32"        # Max supersession chain nodes returned by lineage API.

# -- Episodic Memory Cortex (EMC) — Phase EMC-1 … EMC-4 --
# True episodic store (first-person, time-stamped episodes).
# Lives in the same per-user memory.db as facts/knowledge (Option A).
# Missing human-EM fields stay NULL — never invent values.
EMC_ENABLED: "1"              # Master switch for the episodic store
EMC_EMBED_ON_FLUSH: "1"       # Embed when flushing staging → storage (0 = defer)
EMC_FLUSH_BATCH: "32"         # Max rows moved from staging to storage per flush
EMC_STAGING_MAX: "200"        # Soft upper bound for staging table

# EMC-2: turn eviction into episodic buffer
EMC_EVICT_ENABLED: "1"        # Ingest conversation turns into EMC staging
EMC_EVICT_MIN_CHARS: "40"     # Skip turns shorter than this (combined)
EMC_FLUSH_EVERY_TURNS: "8"    # Flush after this many ingested turns (0 = size-only)
EMC_FLUSH_ON_STAGING: "24"    # Flush when staging count reaches this

# EMC-3: episodic recall + joint EM+SM context budget
EMC_RECALL_ENABLED: "1"       # Inject <episodic_context> into format_for_context
EMC_RECALL_LIMIT: "4"         # Max episodes injected per turn
EMC_KNN_LIMIT: "12"           # Vector candidates before RRF
EMC_FTS_LIMIT: "12"           # Lexical candidates before RRF
EMC_RRF_K: "60"               # Reciprocal Rank Fusion constant
EMC_CONTEXT_CHARS: "900"      # Soft char budget for the whole episodic block
EMC_CONTEXT_EPISODE_CHARS: "280"  # Max chars per episode snippet
EMC_JOINT_BUDGET: "1"         # Shrink SM so EM+SM stay under MEMORY_CONTEXT_TOTAL_CHARS
EMC_RECALL_CACHE_SIZE: "128"  # Max entries in the episodic recall result cache
EMC_RECALL_CACHE_TTL: "20"    # Seconds a recall result stays cached before refresh

# EMC-4: dream distillation EM → SM
EMC_DREAM_ENABLED: "1"        # Run episodic→fact distillation inside dream()
EMC_DREAM_LIMIT: "16"         # Max undistrilled episodes considered per dream
EMC_DREAM_BATCH: "4"          # Episodes per LLM extract call
EMC_DREAM_MIN_CHARS: "60"     # Skip short traces
EMC_DREAM_MAX_TOKENS: "256"   # Token budget for the distill LLM call

# EMC-6: coherent episode formation on flush (group related staging rows)
EMC_GROUP_ENABLED: "1"        # 0 = 1:1 flush as EMC-1/2
EMC_GROUP_MAX_GAP_SEC: "900"  # max seconds between consecutive staging rows in a group
EMC_GROUP_MAX_TURNS: "6"      # max staging rows merged into one episode
EMC_GROUP_MAX_CHARS: "2000"   # max merged trace characters

# -- Performance optimization flags (Phase 20+) --
# Set to 0 to disable expensive features for lower latency/RAM on Jetson
NEURAL_NET_ENABLED: "0"              # Neural activation propagation over entity graph (heavy)
MEMORY_SPREADING_ENABLED: "1"        # Spreading activation from seed entities (extra DB scans)
MEMORY_CROSS_STORE_ENABLED: "1"      # Cross-store knowledge/experience attachment (extra searches)
MEMORY_STATE_TAGS_ENABLED: "1"       # Local-hour state tags on every write (extra column)
MEMORY_NEG_RECALL_AVOID: "0"         # Negative memory avoidance filter (extra scoring)
MEMORY_RECALL_CONTEXT_MATCH_ENABLED: "0"  # Query valence/arousal matching (extra inference)
