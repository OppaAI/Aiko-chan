# Listen config
#
# Settings for sensory/listen.py.
# Controls ASR model/provider, Silero VAD thresholds, barge-in, speaker
# verification, and wake word / trigger phrase activation gating.
# -- ASR --
ASR_DEVICE: "cuda"  # sherpa-onnx execution provider; options usually cpu or cuda.
ASR_LANGUAGE: "auto"  # Transcription language; options: auto, en, ja, zh, ko, yue, nospeech.
ASR_NUM_THREADS: "4"  # CPU inference threads for ASR.
ASR_MODEL: "csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17"  # sherpa-onnx SenseVoice model id/path; first run may download files.

# -- Post-ASR name / phrase fixes (S2, no finetune) --
# Pipe-separated "heard->fixed" pairs. Applied after SenseVoice (longest match first).
# Built-in defaults already cover Aiko / OppaAI mangling; extend here as you observe errors.
ASR_CORRECTIONS: ""  # e.g. "op ai->OppaAI|hey iko->hey Aiko|my project x->Project X"

# -- Voice activity detection --
LISTEN_VAD_SILENCE_MS: "300"  # Silence duration before ending an utterance, in milliseconds.
LISTEN_VAD_PAD_MS: "100"  # Audio padding around detected speech, in milliseconds.
LISTEN_CHUNK_MS: "30"  # Audio chunk size for VAD, in milliseconds; Silero minimum is around 30.
LISTEN_VAD_THRESHOLD: "0.5"  # Silero speech probability threshold; range 0.0-1.0.
LISTEN_SILENCE_CHUNKS: "66"  # Consecutive silent chunks before utterance ends.
LISTEN_MIN_CHUNKS: "10"  # Minimum speech chunks required to accept audio and filter noise.
LISTEN_MAX_SECONDS: "30"  # Hard cap on one recording length in seconds.
LISTEN_DEVICE: ""  # sounddevice input index; blank means system default.

# -- Speaker verification --
SPEAKER_VERIFY_ENABLED: "0"  # Load enrollment model and score each utterance; options: 1/0, true/false, yes/no, on/off.
SPEAKER_VERIFY_GATE: "0"  # When 1 with verify enabled: drop utterances that fail cosine match (other voices do not run the agent). When 0: score is metadata only (legacy).
SPEAKER_MODEL_PATH: "models/3dspeaker_speech_eres2net_sv_en_voxceleb_16k.onnx"  # Path to sherpa-onnx speaker embedding .onnx model.
SPEAKER_VERIFY_THRESHOLD: "0.5"  # Cosine similarity cutoff for speaker match; range 0.0-1.0. Raise to 0.65–0.75 if strangers still pass when gating.
SPEAKER_NUM_THREADS: "1"  # CPU threads for speaker embedding extraction.

# -- Barge-in --
# Master switch: when 0, browser and Jetson must not interrupt TTS (no stopTtsPlayback, no barge event).
BARGE_IN_ENABLED: "0"  # Master barge-in on/off; options: 1/0, true/false, yes/no, on/off.
BARGE_IN_THRESHOLD: "0.95"  # Speech probability threshold to interrupt TTS (local Silero monitor); range 0.0-1.0.
BARGE_IN_CONFIRM_CHUNKS: "4"  # Consecutive chunks above threshold before local barge-in fires (S3: was 2).
BARGE_IN_COOLDOWN_MS: "800"  # Cooldown in milliseconds before another barge-in event can fire.
# S3: ignore barge-in for this many ms after TTS starts (speaker echo / AEC settling).
BARGE_IN_ECHO_GUARD_MS: "450"
# Only meaningful when BARGE_IN_ENABLED=1. When 0, local monitor runs only while TTS wait is armed.
BARGE_IN_ALWAYS_ON: "0"  # Also monitor outside TTS wait; options: 1/0, true/false, yes/no, on/off.

# -- Wake word --
# Fuzzy-matched (not exact substring) against the leading words of each
# transcript, since SenseVoice mangles "Aiko" unpredictably (not a normal
# English word). Blank disables wake-word gating entirely — Aiko responds
# to every utterance as before.
WAKE_WORD: ""  # Phrase that wakes Aiko from idle, e.g. "hey aiko". "" disables.
# Suggested aliases when WAKE_WORD is set (SenseVoice often mangles "Aiko"):
WAKE_WORD_ALIASES: "hey iko|hey eco|hey ecko|hey echo|hey ico|hey aico|hi aiko|hi iko"
WAKE_FUZZY_THRESHOLD: "70"  # Fuzzy match score (0-100) required to count as a wake-word hit.

# -- Trigger phrase --
# Optional second phrase (e.g. with speaker verify). For single-user home use,
# leave blank — wake word alone (or no wake word) is enough.
TRIGGER_PHRASE: ""  # Extra phrase; "" disables. Prefer empty unless multi-user lock is required.
TRIGGER_FUZZY_THRESHOLD: "70"  # Fuzzy match score (0-100) for trigger phrase.
TRIGGER_REQUIRE_SPEAKER_MATCH: "1"  # If trigger is used, require speaker match too.

# -- Activation session --
ACTIVATION_TIMEOUT_S: "3600"  # Idle seconds before requiring wake word again.


# Speak config
#
# Settings for sensory/speak.py.
# Controls MioTTS synthesis endpoint, voice preset, output device, and text pacing.

# -- MioTTS --
MIOTTS_API_URL: "http://localhost:18089"  # MioTTS synthesis API base URL.
MIOTTS_MODEL: "MioTTS-0.4B-Q4_K_M"  # Display/model label for the TTS model served externally.
MIOTTS_PRESET: "aiko_flat"  # Voice preset name registered in MioTTS; examples: jp_female, en_female, custom preset.
MIOTTS_DEVICE: "1"  # sounddevice output index; -1 means system default.
MIOTTS_MAX_TOKENS: 300  # Max audio-codec tokens per synthesis call; caps how long a chunk (and any trailing artifact) can run.
MIOTTS_TEMPERATURE: 0.8  # Sampling temperature for the TTS LLM; lower = more deterministic/stable delivery.
MIOTTS_TOP_P: 1.0  # Nucleus sampling threshold; 1.0 = no truncation of the token distribution.
MIOTTS_REPETITION_PENALTY: 1.15  # Penalizes repeated/held audio tokens; higher discourages drawn-out trailing vowels.
MIOTTS_PRESENCE_PENALTY: 0.0  # Penalizes tokens already used anywhere in the output, regardless of frequency.
MIOTTS_FREQUENCY_PENALTY: 0.0  # Penalizes tokens proportional to how often they've already appeared.
MIOTTS_BEST_OF_N_ENABLED: false  # Generate multiple candidates and pick the best via ASR error-rate scoring.
MIOTTS_BEST_OF_N: 2  # Number of candidates to generate per call when best-of-N is enabled.
KARAOKE_TEXT: "1"  # Pace UI text by TTS audio; options: 1/0, true/false, yes/no, on/off.
