# Social config
#
# Non-secret runtime settings for social, messenger, and media adapters.
# Secrets (tokens, keys, passwords) live in .env / .env.age.
# Identity handles live in .env only (THREADS_USERNAME, BLUESKY_HANDLE).
# AI name for "Hi {AI_NAME}" comes from config/system.yaml AI_NAME.
# Owner display name is read from <USER_SPACE_ROOT>/<user_id>/profile/USER.md.

# -- Weekly workflow (Lane A) --
WEEKLY_SOCIAL_ENABLED: "1"  # Enable/disable weekly social posting.
WEEKLY_SOCIAL_AUTODRAFT: "1"  # Auto-generate draft content from agentic output.
WEEKLY_SOCIAL_AUTOPOST: "0"  # Auto-post draft to providers (requires approval in production).
WEEKLY_SOCIAL_WEEKDAY: "sunday"  # Day of week for weekly posts.
WEEKLY_SOCIAL_TIME: "18:00"  # Time of day for posting (HH:MM format).
WEEKLY_SOCIAL_PROVIDERS: "x, threads"  # Comma-separated list of providers to post to.
WEEKLY_SOCIAL_MAX_CHARS: "260"  # Max characters for weekly post content.
SOCIAL_ROOT: ""  # Override path for social output directory. Defaults to <USER_SPACE_ROOT>/<user_id>/social/.
WEEKLY_SOCIAL_IMAGE_URL: ""  # Optional image URL to attach to weekly posts.

# -- X (Twitter) relay metadata --
TWITTER_RELAY_BASE_URL: "https://api.aisa.one/apis/v1/twitter"  # Base URL for X relay proxy endpoint.
TWITTER_RELAY_TIMEOUT: "30"  # Seconds before X relay HTTP calls time out.

# -- Threads metadata --
THREADS_ACCESS_TOKEN_EXPIRES_AT: ""  # Expiration timestamp for Threads access token (auto-managed; manual override only).
THREADS_REFRESH_BEFORE_EXPIRY_DAYS: "6"  # Days before token expiration to trigger refresh.
THREADS_API_BASE: "https://graph.threads.net/v1.0"  # Base URL for Threads Graph API.
THREADS_TOPIC_TAG: "AI Threads"  # Default topic tag for Threads posts.
THREADS_PUBLISH_DELAY_SECONDS: "5"  # Delay between publish requests to avoid rate limits.
THREADS_REPLY_MONITOR_INTERVAL_SECONDS: "30"  # Poll interval for replies (trigger: Hi {AI_NAME} or @{THREADS_USERNAME}).
THREADS_REPLY_MONITOR_POST_IDS: ""  # Optional comma-separated post IDs; blank discovers own posts.
THREADS_REPLY_BEEP_ENABLED: "1"  # Play one local notification beep per polling cycle with a trigger.
# THREADS_USERNAME / mention / owner name: .env only (THREADS_USERNAME); mention = @ + username; owner from profile/USER.md
THREADS_GLOBAL_MENTIONS_ENABLED: "1"  # Poll /me/mentions for mentions on other users posts.
THREADS_MEMORY_ENABLED: "1"  # Allow only explicit remember this / learn this requests from Threads.
THREADS_INTERACTION_MEMORY_ENABLED: "1"  # Auto-memorize every triggered exchange from the owner account.
THREADS_RECALL_ENABLED: "1"  # Recall up to 3 relevant memories into reply prompts. Private hints only — never surfaced openly.
THREADS_REPLY_LOG_DIR: "logs/threads"  # One redacted JSONL archive per calendar day.
THREADS_IMAGEGEN_ENABLED: "1"  # Let Aiko generate and attach an image when a reply explicitly asks her to draw/gen one.
THREADS_IMAGEGEN_TIMEOUT: "300"  # Seconds before the IMAGEGEN_URL generation call times out (Modal cold starts are slow).
IMGBB_UPLOAD_TIMEOUT: "30"  # Seconds before ImgBB image upload calls time out.

# -- Bluesky two-way reply monitor --
# Handle / app password: BLUESKY_HANDLE + BLUESKY_APP_PASS in .env only.
# Trigger defaults to Hi {AI_NAME}; mention is @ + BLUESKY_HANDLE.
BLUESKY_REPLY_MONITOR_INTERVAL_SECONDS: "30"
BLUESKY_REPLY_BEEP_ENABLED: "1"
BLUESKY_MEMORY_ENABLED: "1"
BLUESKY_INTERACTION_MEMORY_ENABLED: "1"
BLUESKY_RECALL_ENABLED: "1"
BLUESKY_IMAGEGEN_ENABLED: "1"
BLUESKY_IMAGEGEN_TIMEOUT: "300"
BLUESKY_REPLY_LOG_DIR: "logs/bluesky"
BLUESKY_MONITOR_DAEMON_ENABLED: "1"

# -- Photo social (Lane B — Pixelfed) --
PHOTO_SOCIAL_AUTODRAFT: "0"  # Auto-generate draft photo captions.
PHOTO_SOCIAL_AUTOPOST: "0"  # Auto-post photos to providers.
PHOTO_SOCIAL_PROVIDERS: "pixelfed"  # Photo social provider(s) to post to.
PHOTO_SOCIAL_INBOX: "photos/inbox"  # Directory to scan for new photos.
PHOTO_SOCIAL_MAX_ITEMS: "3"  # Max items to process per scan.
PHOTO_SOCIAL_MAX_CHARS: "260"  # Max characters for photo captions.
PHOTO_SOCIAL_ROOT: ""  # Override path for photo social output. Defaults to <USER_SPACE_ROOT>/<user_id>/social/photos/.
PHOTO_SOCIAL_SCAN_INTERVAL_SECONDS: "21600"  # Scan interval (6 hours).
PIXELFED_MEDIA_ROOTS: ""  # Comma-separated approved image roots for post_pixelfed; empty uses the photo social root.

# -- Video social (Lane C — YouTube) --
VIDEO_SOCIAL_AUTODRAFT: "0"  # Auto-generate draft video descriptions.
VIDEO_SOCIAL_AUTOPOST: "0"  # Auto-post videos to providers.
VIDEO_SOCIAL_PROVIDERS: "youtube"  # Video social provider(s) to post to.
VIDEO_SOCIAL_INBOX: "videos"  # Directory to scan for new videos.
VIDEO_SOCIAL_ROOT: ""  # Override path for video social output. Defaults to <USER_SPACE_ROOT>/<user_id>/social/videos/.
VIDEO_SOCIAL_SCAN_INTERVAL_SECONDS: "21600"  # Scan interval (6 hours).

# -- Social scheduling metadata --
WEEKLY_SOCIAL_TIME_OF_DAY: "18:00"  # Time of day for scheduled posts.
WEEKLY_SOCIAL_RETRY_INTERVAL_SECONDS: "1800"  # Retry interval for failed posts (30 minutes).

# -- Lane A1 Patreon dev-post syndication --
PATREON_LATEST_POST_URL: ""  # URL to fetch latest Patreon post for syndication.
AIKO_DEV_GITHUB_REPO: "OppaAI/aiko-dev"  # GitHub repository for aiko-dev content.
AIKO_DEV_GITHUB_BRANCH: "main"  # GitHub branch for aiko-dev content.
AIKO_DEV_HUGO_CONTENT_PATH: "content/posts"  # Hugo content directory path in aiko-dev repo.
A1_FULL_PROVIDERS: ""  # Providers that get the full dev post content.
A1_TEASER_PROVIDERS: "x,bluesky,mastodon,discord,threads"  # Providers that get teaser links only.

# -- Social MCP Server --
SOCIAL_MCP_DB_PATH: ""  # Database path for Social MCP Server state.

# -- Messenger adapters --
AIKO_MESSENGER_ADAPTERS: "discord,telegram"  # Comma-separated list of messenger adapters to enable.

# -- Vision model (photo captioning) --
VISION_MODEL: "minicpm-v"  # Vision model for photo captioning.
VISION_BASE_URL: ""  # Base URL for vision model API; empty uses local/default.
