<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aiko Approval Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/approval-studio.css">
</head>
<body>
    <header class="studio-header">
        <div style="display: flex; align-items: center; gap: 14px;">
            <h1>Aiko Approval Studio</h1>
        </div>
        <div class="header-actions">
            <span class="header-status" id="header-status">Loading drafts…</span>
            <button id="refresh-btn" class="btn">Refresh</button>
        </div>
    </header>

    <div class="studio-body">
        <aside class="sidebar">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <h2>Job Post Drafts</h2>
                <span id="draft-count" style="font-size: 11px; color: var(--dim);">0</span>
            </div>
            <div class="filter-tabs" id="filter-tabs">
                <button class="filter-tab active" data-filter="all">All</button>
                <button class="filter-tab" data-filter="pending">Pending</button>
                <button class="filter-tab" data-filter="approved">Approved</button>
                <button class="filter-tab" data-filter="posted">Posted</button>
            </div>
            <div id="drafts-list"></div>
        </aside>

        <div class="content-area">
            <div class="info-panel" id="info-panel">
                <div class="empty-state" id="info-empty">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <p>Select a draft from the sidebar to review</p>
                </div>
                <div id="info-content" style="display: none;">
                    <h3>Draft Information</h3>
                    <div class="info-grid" id="info-grid"></div>
                    <div class="action-buttons" id="action-buttons" style="display: flex; gap: 8px; margin-top: 14px;"></div>
                </div>
            </div>
            <div class="content-panel url-panel" id="content-panel">
                <div class="empty-state" id="content-empty">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <p>Draft content will appear here</p>
                </div>
                <div id="content-text" class="content-text" style="display: none; white-space: pre-wrap; font-family: ui-serif, Georgia, serif; line-height: 1.6; padding: 16px; color: var(--text);"></div>
            </div>
        </div>

        <!-- Moved URL Panel to right end of panel (3rd column of studio-body) -->
        <div class="content-panel right-panel" id="url-panel" style="border-left: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; overflow: hidden; background: var(--bg2);">
            <h3 style="font-size: 11px; letter-spacing: 0.15em; color: var(--orange); text-transform: uppercase; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                Source Webpage
            </h3>
            <div class="empty-state" id="url-empty" style="padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width: 32px; height: 32px; margin-bottom: 8px; opacity: 0.5;">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                </svg>
                <p>No source URL available for this draft</p>
            </div>

            <!-- Fetched Web Content -->
            <div id="url-content" style="display: none; flex: 1; overflow-y: auto; margin-top: 12px;">
                <div style="margin-bottom: 12px;">
                    <a id="url-link" href="#" target="_blank" rel="noopener" style="color: var(--cyan); font-size: 11px; word-break: break-all;"></a>
                </div>
                <div id="url-text" class="content-text" style="max-height: calc(100% - 40px); overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <script src="/static/approval-studio.js"></script>
</body>
</html>
