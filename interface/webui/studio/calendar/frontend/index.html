<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aiko Calendar Studio</title><link rel="stylesheet" href="static/style.css"></head>
<body><header><div><p class="eyebrow">Aiko · local chief of staff</p><h1>Calendar Studio</h1></div><button id="new-item">+ Plan something</button></header>
<main><section class="brief" aria-label="Daily brief"><div><span>Open</span><strong id="open-count">—</strong></div><div><span>Due today</span><strong id="due-count">—</strong></div><div><span>Overdue</span><strong id="overdue-count">—</strong></div><div class="brief-next"><span>Next up</span><p id="next-up">Loading your day…</p></div></section>
<section class="workspace"><div class="agenda"><div class="section-heading"><div><p class="eyebrow" id="today">Today</p><h2>Agenda & appointments</h2></div><button class="ghost" id="refresh">Refresh</button></div><div id="agenda-list" class="agenda-list"></div><h2 class="schedule-heading">Aiko scheduler</h2><div id="schedule-list" class="schedule-list"></div></div>
<div class="board"><div class="section-heading"><div><p class="eyebrow">Projects</p><h2>Work board</h2></div></div><div class="columns" id="board-columns"></div></div></section></main>
<dialog id="editor"><form method="dialog" id="item-form"><div class="modal-head"><h2 id="modal-title">Plan an item</h2><button class="close" value="cancel">×</button></div><label>What needs attention?<input name="title" required maxlength="160" placeholder="Prepare project brief"></label><div class="row"><label>Type<select name="kind"><option value="task">Task</option><option value="appointment">Appointment</option><option value="draft">Email / message draft</option><option value="workflow">Aiko workflow</option></select></label><label>Status<select name="status"><option value="todo">To do</option><option value="doing">In progress</option><option value="waiting">Waiting</option><option value="done">Done</option></select></label></div><div class="row"><label>Starts<input name="start_at" type="datetime-local"></label><label>Due<input name="due_at" type="datetime-local"></label></div><div class="row"><label>Project<input name="project" placeholder="Personal, Aiko, Client…"></label><label>Priority<select name="priority"><option value="normal">Normal</option><option value="high">High</option><option value="urgent">Urgent</option><option value="low">Low</option></select></label></div><label>Notes / draft<textarea name="notes" rows="4" placeholder="Context, a draft to send, or instructions for Aiko…"></textarea></label><details><summary>Schedule with Aiko</summary><div class="row schedule-fields"><label>Time<input name="schedule_time" type="time" value="09:00"></label><label>Repeat<select name="schedule_frequency"><option value="once">Once</option><option value="daily">Daily</option><option value="weekdays">Weekdays</option><option value="weekly">Weekly</option></select></label></div><label class="check"><input name="schedule_enabled" type="checkbox"> Create a local scheduler reminder</label></details><div class="actions"><button class="danger" type="button" id="delete-item" hidden>Delete</button><button value="cancel" class="ghost">Cancel</button><button type="submit">Save plan</button></div></form></dialog><script src="static/script.js"></script></body></html>
