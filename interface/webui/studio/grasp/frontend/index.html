<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grasp Studio — Working Memory</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <a class="back" href="/">← studios</a>
      <h1>Grasp Studio</h1>
      <span class="badge" id="modeBadge">demo</span>
    </div>
    <div class="meta" id="metaBar">—</div>
    <div class="actions">
      <button class="btn" id="btnSeed">Seed demo</button>
      <button class="btn" id="btnReset">Reset</button>
    </div>
  </header>

  <div class="layout">
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <div class="merge-zone" id="mergeZone">
          <div class="pill-slot" id="pillUser"></div>
          <div class="merge-arrow" id="mergeArrow">→</div>
          <div class="pill-slot" id="pillAsst"></div>
        </div>
        <div class="rack" id="rack"></div>
        <div class="evict-panel" id="evictPanel">
          <h3>Eviction drain</h3>
          <div id="evictList"></div>
        </div>
      </div>

      <div class="chrome">
        <div class="budget">
          <div class="budget-bar"><div class="budget-fill" id="budgetFill"></div></div>
          <span id="budgetText">—</span>
        </div>
        <div class="miller" id="millerDots"></div>
        <span id="gmLabel">0/7</span>
      </div>

      <div class="legend">
        <span><b>Size + glow</b> = score (like retain)</span>
        <span><i class="lg-hi"></i> high focus</span>
        <span><i class="lg-lo"></i> weak / about to recede</span>
        <span>rim fill = score · larger = more salient</span>
      </div>
      <div class="valence-legend">
        <span class="pos"><i></i> positive</span>
        <span class="neu"><i></i> neutral</span>
        <span class="neg"><i></i> negative</span>
        <span>hue = valence (same as memory graph)</span>
      </div>
    </div>

    <aside class="side">
      <h2>Fill turn</h2>
      <label for="inUser">User</label>
      <textarea id="inUser" rows="2" placeholder="user message…"></textarea>
      <label for="inAsst">Assistant</label>
      <textarea id="inAsst" rows="2" placeholder="assistant reply…"></textarea>
      <button class="btn primary block" id="btnFill">Fill into grasp</button>

      <h2 class="mt">Factors (selected)</h2>
      <div id="factorPanel" class="factor-panel muted">Click a node</div>
    </aside>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
