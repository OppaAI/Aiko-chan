<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inner Speech Studio — Aiko's thought journal (read-only)</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #14161c; color: #dfe3ee;
         margin: 0; padding: 24px; max-width: 860px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: #8b93a8; font-size: 0.85rem; margin-bottom: 16px; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat { background: #1d2029; border: 1px solid #2b2f3c; border-radius: 8px;
          padding: 8px 12px; font-size: 0.85rem; }
  .stat b { font-size: 1.1rem; }
  .controls { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  input, select { background: #1d2029; color: #dfe3ee; border: 1px solid #2b2f3c;
                  border-radius: 6px; padding: 6px 10px; font-size: 0.85rem; }
  .thought { background: #1a1d25; border: 1px solid #2b2f3c; border-radius: 10px;
             padding: 12px 14px; margin-bottom: 10px; }
  .thought .text { font-size: 0.95rem; line-height: 1.45; white-space: pre-wrap; }
  .meta { margin-top: 8px; font-size: 0.75rem; color: #8b93a8; display: flex;
          gap: 10px; flex-wrap: wrap; }
  .badge { background: #2b2f3c; border-radius: 4px; padding: 1px 7px; }
  .badge.consolidated { background: #2c4a38; color: #9fe0b4; }
  .empty { color: #8b93a8; padding: 32px 0; text-align: center; }
  .note { font-size: 0.75rem; color: #6b7280; margin-top: 24px; }
</style>
</head>
<body>
<h1>💭 Inner Speech Studio</h1>
<div class="sub">Aiko's private thought journal — read-only. Thoughts are never
copied into chat, spoken, or edited from here.</div>
<div class="stats" id="stats"></div>
<div class="controls">
  <input id="q" type="search" placeholder="search thoughts…" style="flex:1;min-width:200px">
  <select id="kind"><option value="">all kinds</option></select>
  <select id="source"><option value="">all sources</option></select>
  <button id="reload">↻</button>
</div>
<div id="list"></div>
<div class="note">Salience-gated: she thinks only on turns that cross the gate —
silence is normal. Unconsolidated thoughts join the midnight dream.</div>
<script>
const $ = id => document.getElementById(id);
async function api(path) {
  const r = await fetch(path);
  return r.json();
}
function esc(s) {
  return (s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
async function loadStats() {
  const s = await api("api/stats");
  if (!s.exists) { $("stats").innerHTML = '<div class="stat">no inner_speech.db yet — chat with her first</div>'; return; }
  $("stats").innerHTML =
    `<div class="stat"><b>${s.total}</b> thoughts</div>` +
    `<div class="stat"><b>${s.unconsolidated}</b> unconsolidated</div>` +
    `<div class="stat"><b>${s.consolidated}</b> in dreams</div>` +
    (s.latest_at ? `<div class="stat">latest ${esc(s.latest_at.slice(0,16).replace("T"," "))}</div>` : "");
  for (const [sel, obj] of [["kind", s.by_kind], ["source", s.by_source]]) {
    const el = $(sel);
    el.innerHTML = `<option value="">all ${sel}s</option>` +
      Object.keys(obj || {}).sort().map(k => `<option>${esc(k)}</option>`).join("");
  }
}
async function loadThoughts() {
  const p = new URLSearchParams({
    limit: 50, q: $("q").value.trim(), kind: $("kind").value, source: $("source").value,
  });
  const d = await api("api/thoughts?" + p);
  const list = $("list");
  if (!d.exists || !d.thoughts.length) {
    list.innerHTML = '<div class="empty">no thoughts yet — they appear when the salience gate fires</div>';
    return;
  }
  list.innerHTML = d.thoughts.map(t => `
    <div class="thought">
      <div class="text">${esc(t.text)}</div>
      <div class="meta">
        <span class="badge">${esc(t.kind)}</span>
        <span class="badge">${esc(t.source)}</span>
        ${t.consolidated ? '<span class="badge consolidated">dream ✓</span>' : ""}
        <span>${esc((t.created_at || "").slice(0,16).replace("T"," "))}</span>
        ${t.access_count ? `<span>recalled ×${t.access_count}</span>` : ""}
      </div>
    </div>`).join("");
}
$("reload").onclick = () => { loadStats(); loadThoughts(); };
$("q").oninput = () => loadThoughts();
$("kind").onchange = () => loadThoughts();
$("source").onchange = () => loadThoughts();
loadStats(); loadThoughts();
</script>
</body>
</html>
