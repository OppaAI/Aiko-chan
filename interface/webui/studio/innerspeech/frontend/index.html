<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inner Speech Studio — Aiko's thought journal (read-only)</title>
<script>try{var __t=localStorage.getItem('aiko-theme')||'light';document.documentElement.dataset.theme=(__t==='dark'?'dark':'light');window.addEventListener('storage',function(e){if(e&&e.key==='aiko-theme'){document.documentElement.dataset.theme=(e.newValue==='dark'?'dark':'light');}});}catch(__e){document.documentElement.dataset.theme='light';}</script>
<style>
  /* Theme follows the main WebUI toggle (localStorage 'aiko-theme', read by
     the head script): light = moss paper, dark = purple glass — the same
     palettes as the shared studio sheets. */
  :root {
    color-scheme: light;
    --bg: #f4f0e6; --text: #4a3728; --muted: #7a8f68;
    --panel: #faf8f1; --card: #f7f3e9; --border: rgba(58, 74, 46, 0.16);
    --badge: #e8e2d4; --cons-bg: rgba(91, 122, 78, 0.16); --cons-fg: #3a4a2e;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d0718; --text: #ded3f7; --muted: #9a82c4;
    --panel: #211738; --card: #1d1332; --border: rgba(196, 181, 253, 0.16);
    --badge: #241a3e; --cons-bg: rgba(147, 201, 138, 0.15); --cons-fg: #a5d69c;
  }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
         margin: 0; padding: 24px; max-width: 860px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
          padding: 8px 12px; font-size: 0.85rem; }
  .stat b { font-size: 1.1rem; }
  .controls { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  input, select { background: var(--panel); color: var(--text); border: 1px solid var(--border);
                  border-radius: 6px; padding: 6px 10px; font-size: 0.85rem; }
  .thought { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
             padding: 12px 14px; margin-bottom: 10px; }
  .thought .text { font-size: 0.95rem; line-height: 1.45; white-space: pre-wrap; }
  .meta { margin-top: 8px; font-size: 0.75rem; color: var(--muted); display: flex;
          gap: 10px; flex-wrap: wrap; }
  .badge { background: var(--badge); border-radius: 4px; padding: 1px 7px; }
  .badge.consolidated { background: var(--cons-bg); color: var(--cons-fg); }
  .empty { color: var(--muted); padding: 32px 0; text-align: center; }
  .note { font-size: 0.75rem; color: var(--muted); margin-top: 24px; }
</style>
</head>
<body>
<h1>💭 Inner Speech Studio</h1>
<div class="sub">Aiko's private thought journal — read-only. Thoughts are never
copied into chat, spoken, or edited from here.</div>
<div class="stats" id="stats"></div>
<div class="controls">
  <input id="q" type="search" placeholder="search thoughts…" style="flex:1;min-width:200px">
  <select id="kind"><option value="">all kinds</option></select>
  <select id="source"><option value="">all sources</option></select>
  <button id="reload">↻</button>
</div>
<div id="list"></div>
<div class="note">Salience-gated: she thinks only on turns that cross the gate —
silence is normal. Unconsolidated thoughts join the midnight dream.</div>
<script>
const $ = id => document.getElementById(id);
let _reqSeq = 0;          // stale-response guard for the debounced search
let _debounceT = null;
function showError(msg) {
  $("list").innerHTML = `<div class="empty">⚠️ ${msg}</div>`;
}
async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(`request failed (${r.status})`);
  return r.json();
}
function esc(s) {
  return (s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
async function loadStats() {
  try {
    const s = await api("api/stats");
    if (!s.exists) { $("stats").innerHTML = '<div class="stat">no inner_speech.db yet — chat with her first</div>'; return; }
    $("stats").innerHTML =
      `<div class="stat"><b>${s.total}</b> thoughts</div>` +
      `<div class="stat"><b>${s.unconsolidated}</b> unconsolidated</div>` +
      `<div class="stat"><b>${s.consolidated}</b> in dreams</div>` +
      (s.latest_at ? `<div class="stat">latest ${esc(s.latest_at.slice(0,16).replace("T"," "))}</div>` : "");
    for (const [sel, obj] of [["kind", s.by_kind], ["source", s.by_source]]) {
      const el = $(sel);
      el.innerHTML = `<option value="">all ${sel}s</option>` +
        Object.keys(obj || {}).sort().map(k => `<option>${esc(k)}</option>`).join("");
    }
  } catch (e) {
    $("stats").innerHTML = '<div class="stat">⚠️ stats unavailable</div>';
  }
}
async function loadThoughts() {
  const mySeq = ++_reqSeq;
  const p = new URLSearchParams({
    limit: 50, q: $("q").value.trim(), kind: $("kind").value, source: $("source").value,
  });
  let d;
  try {
    d = await api("api/thoughts?" + p);
  } catch (e) {
    if (mySeq === _reqSeq) showError("couldn't load thoughts — " + (e.message || "network error"));
    return;
  }
  if (mySeq !== _reqSeq) return;  // a newer keystroke already superseded this
  const list = $("list");
  if (!d.exists || !d.thoughts.length) {
    list.innerHTML = '<div class="empty">no thoughts yet — they appear when the salience gate fires</div>';
    return;
  }
  list.innerHTML = d.thoughts.map(t => `
    <div class="thought">
      <div class="text">${esc(t.text)}</div>
      <div class="meta">
        <span class="badge">${esc(t.kind)}</span>
        <span class="badge">${esc(t.source)}</span>
        ${t.consolidated ? '<span class="badge consolidated">dream ✓</span>' : ""}
        <span>${esc((t.created_at || "").slice(0,16).replace("T"," "))}</span>
        ${t.access_count ? `<span>recalled ×${t.access_count}</span>` : ""}
      </div>
    </div>`).join("");
}
$("reload").onclick = () => { loadStats(); loadThoughts(); };
$("q").oninput = () => {
  clearTimeout(_debounceT);
  _debounceT = setTimeout(loadThoughts, 250);
};
$("kind").onchange = () => loadThoughts();
$("source").onchange = () => loadThoughts();
loadStats(); loadThoughts();
</script>
</body>
</html>
