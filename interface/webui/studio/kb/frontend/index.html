<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aiko · Knowledge Graph</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>
  <header>
    <h1>Knowledge Graph</h1>
    <span class="sub">learned chunks · entities only · size = importance</span>
  </header>
  <div class="wrap">
    <aside class="sidebar">
      <label>Limit <input type="number" id="limit" value="200" min="20" max="500" /></label>
      <label>Min importance <input type="number" id="min-imp" value="0" min="0" max="1" step="0.05" /></label>
      <label>Entity contains <input type="text" id="filter-entity" placeholder="e.g. ros2" /></label>
      <button class="btn" id="reload" style="margin-top:10px">Load graph</button>
      <button class="btn" id="refilter" style="margin-top:6px">Re-filter</button>
      <div class="legend">
        <div><span class="swatch" style="background:#4ade80"></span>Knowledge chunk</div>
        <div><span class="swatch" style="background:#a78bfa"></span>Entity hub</div>
        <div style="margin-top:6px">Larger + brighter = higher importance<br/>(access · recency · entities)</div>
      </div>
      <div class="details" id="details"></div>
    </aside>
    <div id="canvas">
      <svg id="svg"></svg>
      <div class="zoom-ctl">
        <button type="button" id="z-in" aria-label="Zoom in" title="Zoom in">+</button>
        <button type="button" id="z-out" aria-label="Zoom out" title="Zoom out">−</button>
        <button type="button" id="z-fit" aria-label="Reset zoom" title="Reset zoom">⊡</button>
      </div>
    </div>
  </div>
  <script src="/static/script.js"></script>
</body>
</html>
