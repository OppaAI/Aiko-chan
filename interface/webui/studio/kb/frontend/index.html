<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aiko KB Storage</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <header class="studio-header">
        <div style="display: flex; align-items: center; gap: 14px;">
            <a href="javascript:history.back();" title="Return" class="back-btn">←</a>
            <h1>Aiko KB Storage</h1>
        </div>
        <div class="header-actions">
            <span class="header-status" id="header-status">read-only</span>
            <button id="refresh-btn" class="btn">Refresh</button>
        </div>
    </header>

    <div class="studio-body">
        <aside class="sidebar">
            <div class="stat-cards">
                <div class="stat-card"><span class="stat-num" id="stat-docs">–</span><span class="stat-label">Documents</span></div>
                <div class="stat-card"><span class="stat-num" id="stat-chunks">–</span><span class="stat-label">Chunks</span></div>
                <div class="stat-card"><span class="stat-num" id="stat-active">–</span><span class="stat-label">Active</span></div>
                <div class="stat-card"><span class="stat-num" id="stat-superseded">–</span><span class="stat-label">Superseded</span></div>
                <div class="stat-card"><span class="stat-num" id="stat-archived">–</span><span class="stat-label">Archived</span></div>
            </div>

            <h2>Filters</h2>
            <div class="filter-row">
                <input id="search-input" type="text" placeholder="Search title / source…">
            </div>
            <div class="filter-row">
                <select id="kind-filter">
                    <option value="">All kinds</option>
                </select>
            </div>
            <div id="kind-stats"></div>
        </aside>

        <main class="main-area">
            <div id="docs-list" class="docs-list"></div>
            <div id="detail-view" class="detail-view" style="display:none">
                <button id="back-btn" class="btn">← Docs</button>
                <div id="detail-content"></div>
            </div>
        </main>
    </div>

    <script src="static/script.js"></script>
</body>
</html>
