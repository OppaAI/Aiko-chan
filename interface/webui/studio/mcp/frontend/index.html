<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aiko MCP Studio</title>
    <link rel="stylesheet" href="shared/css/tokens.css">
    <link rel="stylesheet" href="shared/css/base.css">
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <header class="studio-header">
        <div style="display: flex; align-items: center; gap: 14px;">
            <a href="#" id="back-btn" title="Return to previous page" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; background: #1a1028; border: 1px solid var(--dim); border-radius: 50%; color: var(--purple); text-decoration: none; transition: all 0.2s; font-weight: bold; font-size: 16px;">←</a>
            <h1>Aiko MCP Studio</h1>
        </div>
        <div class="header-actions">
            <span class="header-status" id="header-status">Loading…</span>
            <button id="refresh-btn" class="btn" type="button">Refresh</button>
        </div>
    </header>

    <div class="studio-body">
        <aside class="sidebar">
            <h2>Servers</h2>
            <div id="servers-list"></div>
        </aside>
        <main class="main-panel" id="main-panel">
            <div class="empty-state" id="empty-state">Select an MCP server</div>
            <div id="server-detail" style="display:none"></div>
        </main>
    </div>

    <script src="shared/graph-bootstrap.js"></script>
    <script src="static/mcp-servers.js"></script>
  <script>
    document.getElementById('back-btn').addEventListener('click', function(e) {
      e.preventDefault();
      if (window.history.length > 1) window.history.back();
      else window.location.href = '/';
    });
  </script>
</body>
</html>
