<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aiko MCP Studio</title>
    <link rel="stylesheet" href="shared/css/tokens.css">
    <link rel="stylesheet" href="shared/css/base.css">
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <header class="studio-header">
        <div style="display: flex; align-items: center; gap: 14px;">
            <a href="#" id="back-btn" title="Return to previous page" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; background: #1a1028; border: 1px solid var(--dim); border-radius: 50%; color: var(--purple); text-decoration: none; transition: all 0.2s; font-weight: bold; font-size: 16px;">←</a>
            <h1>Aiko MCP Studio</h1>
        </div>
        <div class="header-actions">
            <span class="header-status" id="header-status">Loading servers…</span>
            <button id="refresh-btn" class="btn">Refresh</button>
        </div>
    </header>

    <div class="studio-body">
        <aside class="sidebar">
            <h2>MCP Servers</h2>
            <div id="servers-list"></div>
        </aside>

        <div class="content-area">
            <div class="server-detail" id="server-detail">
                <div class="empty-state" id="detail-empty">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="2" y="2" width="20" height="20" rx="2"></rect>
                        <path d="M7 12l3 3 7-7"></path>
                        <circle cx="12" cy="12" r="1"></circle>
                    </svg>
                    <p>Select an MCP server from the sidebar to view details</p>
                </div>
                <div id="detail-content" style="display: none;">
                    <h3>Server Details</h3>
                    <div class="detail-grid" id="detail-grid"></div>
                    <div class="tools-section">
                        <h4>Available Tools</h4>
                        <div id="tools-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="shared/graph-bootstrap.js"></script>
    <script src="static/mcp-servers.js"></script>
  <script>
    document.getElementById('back-btn').addEventListener('click', function(e) {
      e.preventDefault();
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = '/';
      }
    });
  </script>
</body>
</html>
