<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aiko · Knowledge Graph</title>
  <link rel="stylesheet" href="shared/css/tokens.css" />
  <link rel="stylesheet" href="shared/css/base.css" />
  <link rel="stylesheet" href="static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>
  <header>
    <div style="display: flex; align-items: center; gap: 14px;">
      <a href="#" id="back-btn" title="Back"
         style="display:flex;align-items:center;justify-content:center;width:32px;height:32px;background:#1a1028;border:1px solid var(--dim);border-radius:50%;color:var(--purple);text-decoration:none;font-weight:bold;">←</a>
      <h1>Knowledge Graph</h1>
    </div>
    <div class="hdr-right">
      <span id="meta"></span>
      <button id="btn-refresh" type="button">Refresh</button>
    </div>
  </header>
  <div class="wrap">
    <aside class="side">
      <label>Search</label>
      <input id="q" type="search" placeholder="Query knowledge…" />
      <div id="hits"></div>
    </aside>
    <div class="main">
      <svg id="g"></svg>
    </div>
  </div>
  <script src="shared/graph-bootstrap.js"></script>
  <script src="static/kb-graph.js"></script>
  <script>
    document.getElementById('back-btn').addEventListener('click', function(e) {
      e.preventDefault();
      if (window.history.length > 1) window.history.back();
      else window.location.href = '/';
    });
  </script>
</body>
</html>
