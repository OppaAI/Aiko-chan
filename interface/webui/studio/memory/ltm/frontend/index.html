<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aiko Neural LTM</title>
  <link rel="stylesheet" href="static/style.css" />
</head>
<body>
  <header>
    <div style="display: flex; align-items: center; gap: 14px;">
<a href="#" id="back-btn" title="Back"
          style="display:flex;align-items:center;justify-content:center;width:32px;height:32px;background:#1a1028;border:1px solid var(--dim);border-radius:50%;color:var(--purple);text-decoration:none;font-weight:bold;">←</a>
      <h1>Neural LTM</h1>
    </div>
    <div class="actions">
      <span id="status" style="font-size:11px;color:var(--dim)"></span>
      <button class="btn" id="refresh">Refresh</button>
      <button class="btn btn-primary" id="export">Export JSON</button>
    </div>
  </header>
  <div class="body">
    <aside class="sidebar">
      <nav class="memory-studio-tabs" aria-label="Memory studio sections">
        <a class="memory-studio-tab" href="/studio/memory/stm/">STM</a>
        <a class="memory-studio-tab active" href="/studio/memory/ltm/" aria-current="page">LTM</a>
        <a class="memory-studio-tab" href="/studio/memory/kb/">KB</a>
      </nav>
      <h2>Search</h2>
      <label>Query <input type="text" id="search-q" placeholder="e.g. ROS2, OppaAI…" /></label>
      <button class="btn btn-primary" id="search-btn" style="width:100%;margin-top:4px">Search mem + KB</button>
      <div class="stat" id="search-stats">—</div>
      <h2>Filters</h2>
      <label>User id <input type="text" id="user-id" placeholder="(current)" /></label>
      <label>Limit <input type="number" id="limit" value="200" min="1" max="2000" /></label>
      <label>From <input type="date" id="date-from" /></label>
      <label>To <input type="date" id="date-to" /></label>
      <label><input type="checkbox" id="include-history" checked /> Include superseded</label>
      <label><input type="checkbox" id="include-entities" checked /> Entity hubs</label>
      <label><input type="checkbox" id="include-knowledge" checked /> Knowledge</label>
      <label><input type="checkbox" id="include-experience" checked /> Experience</label>
      <label><input type="checkbox" id="include-episodes" checked /> Episodes (EM)</label>
      <label><input type="checkbox" id="layer-memory" checked /> Show memory</label>
      <label><input type="checkbox" id="layer-entity" checked /> Show entities</label>
      <label><input type="checkbox" id="layer-knowledge" checked /> Show knowledge</label>
      <label><input type="checkbox" id="layer-experience" checked /> Show experience</label>
      <label><input type="checkbox" id="layer-episode" checked /> Show episodes</label>
      <label>Status
        <select id="filter-status">
          <option value="all">all</option>
          <option value="active">active</option>
          <option value="superseded">superseded</option>
        </select>
      </label>
      <label>Entity contains <input type="text" id="filter-entity" placeholder="optional" /></label>
      <button class="btn" id="apply" style="width:100%;margin-top:8px">Apply</button>
      <button class="btn" id="apply-filters" style="width:100%;margin-top:4px">Re-render layers</button>
      <div class="stat" id="stats">—</div>
      <h2>Legend</h2>
      <div class="stat" style="line-height:1.5">
        memory · entity · knowledge · experience · <span style="color:#e879f9">episode</span><br/>
        size ≈ retain / salience<br/>
        rim arcs: salience · spacing · connectivity · valence · access
      </div>
    </aside>
    <main class="canvas-wrap">
      <svg id="canvas"></svg>
      <div class="zoom-controls">
        <button class="btn" id="zoom-in">+</button>
        <button class="btn" id="zoom-out">−</button>
        <button class="btn" id="zoom-fit">fit</button>
      </div>
      <div id="details" class="details" style="display:none"></div>
    </main>
  </div>
  <script src="/shared/graph-bootstrap.js"></script>
  <script src="static/script.js"></script>
</body>
</html>
