<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aiko · Settings</title>
<script>try{var __t=localStorage.getItem('aiko-theme')||'light';document.documentElement.dataset.theme=(__t==='dark'?'dark':'light');window.addEventListener('storage',function(e){if(e&&e.key==='aiko-theme'){document.documentElement.dataset.theme=(e.newValue==='dark'?'dark':'light');}});}catch(__e){document.documentElement.dataset.theme='light';}</script>
<link rel="stylesheet" href="shared/css/studio-theme.css">
<link rel="stylesheet" href="static/settings.css">
  <link rel="stylesheet" href="shared/css/appearance.css" />
</head>
<body>
<header class="set-header">
  <a class="back" href="/">← Chat</a>
  <div>
    <h1 class="brand">Aiko’s settings</h1>
    <div class="sub">Configuration files and encrypted secrets</div>
  </div>
  <button id="set-theme" type="button" aria-label="Toggle light and dark theme">◐ Theme</button>
</header>

<div class="set-toolbar">
  <label for="set-search">Find a setting</label>
  <input id="set-search" type="search" placeholder="Search names, keys or files…" autocomplete="off">
  <span id="set-coverage" class="set-note"></span>
</div>
<div id="set-tabs" class="set-tabs" role="tablist"></div>
<main id="set-groups"></main>
<details class="set-sources"><summary>Configuration sources</summary><p id="set-sources"></p></details>

<footer class="set-footer">
  <div class="set-note"><span id="set-count">No unsaved changes.</span><br>Sampling changes apply to the next chat. Other settings require a restart.</div>
  <button id="set-save" type="button">Save settings</button>
  <span id="set-status" role="status"></span>
</footer>
<script src="static/settings.js"></script>
</body>
</html>
