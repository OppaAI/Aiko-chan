[project]
requires-python = ">=3.12,<3.13"
name = "Aiko-chan"
version = "0.1.5"
description = "Aiko-chan: AI companion with persistent memory, web search, and conversational interface"
readme = "README.md"
dependencies = [
    "coloredlogs>=15.0.1",
    "flatbuffers>=25.12.19",
    "httpx>=0.28.1",
    "huggingface-hub>=1.21.0",
    "itsdangerous>=2.2.0",
    "numpy>2",
    "onnxruntime-gpu==1.27.0; platform_machine == 'x86_64'",
    "onnxruntime-gpu; platform_machine == 'aarch64'",
    "openai>=2.43.0",
    "packaging>=26.2",
    "protobuf>=6.33.6",
    "pyyaml>=6.0.3",
    "pydantic>=2",
    "python-dotenv>=1.0.0",
    "requests>=2.34.2",
    "scipy<1.18.0",
    "sherpa-onnx>=1.13.3",
    "sounddevice>=0.5.5",
    "soundfile>=0.14.0",
    "sqlite-vec>=0.1.9",
    "tokenizers>=0.23.1",
    "trafilatura>=2.1.0",
    "websockets>=15.0,<16.0",
    "psutil>=7.2.2",
    "fastapi[standard]>=0.139.0",
    "uvicorn>=0.50.2",
    "defusedxml>=0.7.1",
    "sentencepiece>=0.2.2",
    "pytest>=9.1.1",
    "lark>=1.3.1",
    "markitdown>=0.1.6",
    "livekit-wakeword>=0.2.1",
    "protonmail-api-client>=2.4.3",
    "discord-py>=2.7.1",
    "python-telegram-bot>=22.8",
    "davey>=0.1.6",
    "pynacl>=1.6.2",
    "pysqlcipher3==1.2.0",
    "mcp>=1.29.0",
    "fastmcp>=3.4.6",
]

[project.optional-dependencies]
discord = ["discord-py>=2.4.0"]
telegram = ["python-telegram-bot>=21.0"]
twitter = ["tweepy>=4.14.0"]
slack = ["slack-sdk>=3.27.0"]
matrix = ["matrix-nio>=0.25.0"]
bluesky = ["atproto>=0.0.34"]
mastodon = ["Mastodon.py>=1.8.0"]
reddit = ["praw>=7.7.0"]
youtube = []  # uses raw requests (requests already a core dep)
msal = ["msal>=1.30.0"]
adapters = [
    "discord-py>=2.4.0",
    "python-telegram-bot>=21.0",
    "slack-sdk>=3.27.0",
    "matrix-nio>=0.25.0",
]

[tool.uv]
override-dependencies = [
    "onnxruntime; sys_platform == 'ignore_this_marker'",
    "onnxruntime-gpu>=1.17.0"
]

[tool.uv.sources]
onnxruntime-gpu = { path = "/home/oppa-ai/wheels/onnxruntime_gpu-1.27.0-cp312-cp312-linux_aarch64.whl", marker = "platform_machine == 'aarch64'" }
