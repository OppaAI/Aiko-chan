[pytest]
# Default collection is hermetic unit/integration coverage and the conscience
# gate contract. Hardware/performance and standalone evals remain opt-in.
pythonpath = .
testpaths =
    tests/unit
    tests/integration
    cognition/conscience/test_conscience_gate.py

markers =
    perf: performance/latency benchmarks requiring real hardware (Jetson) and real models -- excluded from default test runs, invoke explicitly with `--run-live -m perf --benchmark-only` against tests/perf/
    integration: real components wired together (contextvars + real SQLite + fake embedder) -- included in the default suite
    stress: concurrency/load tests (real queue + threads + real timing) -- excluded from default test runs, invoke explicitly with `-m stress` against tests/stress/

# Fail loudly on unknown markers instead of silently ignoring typos.
addopts = --strict-markers -p no:launch_testing -p no:launch_testing_ros
